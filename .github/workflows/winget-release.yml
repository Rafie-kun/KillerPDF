# A release-triggered run starts seconds after release.ps1 finished creating the release and
# uploading its assets, and GitHub throttles the branch push komac needs on the way out. It
# surfaces as "Ref cannot be created" or "SteveTheKiller does not have the correct permissions
# to execute CreateRef", which reads like a bad token and is not: the same secret succeeds on a
# later retry. 1.7.5 failed this way and its workflow_dispatch retry succeeded 23 minutes later.
# The submit step now settles first and retries with backoff.
#
# workflow_dispatch is still the manual retry path: re-running this with the tag is the fix for
# anything the backoff does not outlast, and it needs no re-release.

name: WinGet Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.1)'
        required: true

jobs:
  submit:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Update WinGet validator
        shell: pwsh
        run: |
          Install-Module Microsoft.WinGet.Client -Scope CurrentUser -Force -Repository PSGallery
          Repair-WinGetPackageManager -Latest
          winget --version
        env:
          # Without a token the module's GitHub release lookup is anonymous and shares the
          # hosted runner's IP rate limit, which fails the job before anything is submitted.
          GITHUB_TOKEN: ${{ github.token }}

      # Komac runs with the WinGet publishing token, so it is a pinned, reviewed release whose
      # bytes are checked before it can run. Update the version and digest together, on purpose.
      - name: Install Komac
        run: |
          $url = "https://github.com/russellbanks/Komac/releases/download/v$env:KOMAC_VERSION/komac-$env:KOMAC_VERSION-x86_64-pc-windows-msvc.exe"
          $download = Join-Path $env:RUNNER_TEMP ("komac-download-" + [guid]::NewGuid() + ".exe")
          Invoke-WebRequest -Uri $url -OutFile $download
          $actual = (Get-FileHash $download -Algorithm SHA256).Hash
          if ($actual -ne $env:KOMAC_SHA256) {
            Remove-Item $download -Force
            throw "Komac $env:KOMAC_VERSION does not match its pinned SHA-256 (got $actual). Nothing was run."
          }
          $tools = Join-Path $env:RUNNER_TEMP "komac-bin"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Move-Item $download (Join-Path $tools "komac.exe") -Force
          Add-Content $env:GITHUB_PATH $tools
        env:
          KOMAC_VERSION: 2.16.0
          KOMAC_SHA256: BDC45BAF028F750DA7519CC8A5F2EAB5DFEF46DFE88650EEB0D0A9BF51446E4F
        shell: pwsh

      - name: Submit to WinGet
        run: |
          $manifestDirectory = Join-Path $env:RUNNER_TEMP ("winget-" + [guid]::NewGuid())
          ./build/New-WinGetManifest.ps1 -Tag $env:RELEASE_TAG -OutputDirectory $manifestDirectory
          winget validate --manifest $manifestDirectory
          if ($LASTEXITCODE -ne 0) { throw "WinGet manifest validation failed." }

          # Let the release settle before asking GitHub for a branch. See the header note.
          if ("${{ github.event_name }}" -eq "release") { Start-Sleep -Seconds 90 }

          # komac picks a fresh GUID for its branch name every run, so a retry never collides
          # with a half-finished attempt.
          $delays = @(60, 150, 300)
          for ($i = 0; $i -le $delays.Count; $i++) {
              komac submit $manifestDirectory --yes
              if ($LASTEXITCODE -eq 0) { exit 0 }
              if ($i -eq $delays.Count) { break }
              Write-Host "Submit failed with exit $LASTEXITCODE. Retrying in $($delays[$i])s."
              Start-Sleep -Seconds $delays[$i]
          }
          Write-Error "komac submit failed after $($delays.Count + 1) attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        shell: pwsh
